[[edit]]
migrated = false
paths = ["src/layout/mod.rs", "src/layout/workspace.rs", "src/layout/floating_tree.rs", "src/layout/floating_tree/interaction.rs", "src/layout/floating_tree/commands.rs", "src/input/move_grab.rs", "src/handlers/xdg_shell/requests.rs"]
what = "Pointer move and resize act on floating groups. A modifier or titlebar drag on a view inside a group moves the group root in place (`Layout::floating_group_move`), not by detaching the view's tile. A modifier resize resizes the root from the root's quadrant (`FloatingLayout::tree_resize`), and the children keep their split ratios. A border drag on a group view resizes it against its sibling inside the group's tree. The group's outer edges resize nothing. Client move and resize requests from a group view are refused."
why = "In sway a view inside a floating container is floating-or-child but not floating (`container_is_floating`, `container_is_floating_or_child`, sway/tree/container.c:1041-1050,1338-1340). Its modifier or titlebar move and its modifier resize therefore go to `container_toplevel_ancestor` (sway/input/seatop_default.c:459-487). Its border press takes the tiled branch, `seatop_begin_resize_tiling` (sway/input/seatop_default.c:396-411), where `edge_is_external` drops an outer edge (seatop_default.c:39-75,111-118). The group container has no border of its own (sway/tree/container.c:88-94). xdg move and resize requests need `container_is_floating` (sway/desktop/xdg_shell.c:430-451). niri's detaching interactive move and per-window floating resize found no group view, so the drags did nothing."
