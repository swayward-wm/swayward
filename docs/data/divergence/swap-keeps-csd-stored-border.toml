[[edit]]
migrated = false
paths = ["src/layout/mod.rs", "src/layout/tile.rs"]
what = "`swap` pins every view's stored border for the duration of the swap, so a CSD view keeps `csd` (or its saved style) when it trades a floating place for a tiled one."
why = "Sway's `swap_places` re-parents both containers without `container_set_floating` (sway/tree/container.c:1718-1764), so the CSD border conversion done there never runs. Swayward's reinsert paths applied it, so a floating hinted view swapped into a tiled slot reported \"normal\" where sway reports \"csd\" (differential family diff-fam-v3-hinted-swap-border)."
