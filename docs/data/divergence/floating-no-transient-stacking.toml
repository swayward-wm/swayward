[[edit]]
migrated = false
paths = ["src/layout/floating_tree.rs", "src/layout/floating_tree/commands.rs", "src/layout/floating_tree/interaction.rs", "src/layout/workspace.rs", "src/layout/mod.rs", "src/handlers/xdg_shell/requests.rs", "src/layout/tests/operations/window.rs"]
what = "drop niri's transient placement and stacking: a floating dialog is centred on the workspace and added on top like any other floating view instead of over and above its xdg parent, activating or adding a parent no longer brings its dialogs up, the parent_changed handler, add_tile_above and descendants_added are gone, and the children-above-parents invariant is no longer checked."
why = "Sway has no transient stacking. Floating a container appends it to `workspace->floating` (`container_set_floating` -> `workspace_add_floating`, sway/tree/container.c:941-954, sway/tree/workspace.c:961-971) whatever its xdg parent, centres it on the workspace (`container_floating_resize_and_center`, sway/tree/container.c:848-893), and GET_TREE lists that order (sway/ipc-json.c:532-540). niri kept a dialog above and over its parent, so floating a parent after its dialog listed the parent first, and a dialog placed over its parent changed which floater a directional focus reached. Family diff-fam-v3-hinted-map-focus-order; oracle row hinted_child_map_then_float_parent_order."
