name: Nightly live IPC soak

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  live-ipc-soak:
    name: ${{ matrix.outputs }} headless output(s)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        outputs: [1, 2]
    env:
      DEPS_APT: curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev foot
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Run live IPC soak
        env:
          WLR_HEADLESS_OUTPUTS: ${{ matrix.outputs }}
        run: |
          set -uo pipefail
          runtime="$RUNNER_TEMP/swayward-runtime-${{ matrix.outputs }}"
          mkdir -m 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          unset DISPLAY WAYLAND_DISPLAY WAYLAND_SOCKET SWAYSOCK I3SOCK
          grep -v 'spawn-at-startup' resources/default-config.kdl > "$runtime/config.kdl"

          unit="swayward-soak-${GITHUB_RUN_ID}-${{ matrix.outputs }}"
          # The runner shell owns the log; sudo only creates the capped scope.
          # sudo resets the environment, so pass the private runtime dir and
          # the headless output count into the scope explicitly.
          # shellcheck disable=SC2024
          sudo systemd-run --scope --quiet --collect --unit="$unit" \
            --uid="$(id -u)" -p MemoryMax=2G -p MemorySwapMax=0 \
            -p TimeoutStopSec=10s \
            --setenv=XDG_RUNTIME_DIR="$runtime" \
            --setenv=WLR_HEADLESS_OUTPUTS="$WLR_HEADLESS_OUTPUTS" \
            timeout --signal=TERM --kill-after=5s 1800s \
            target/release/swayward -c "$runtime/config.kdl" \
            >"$runtime/compositor.log" 2>&1 &
          compositor=$!
          # /proc existence needs no signal permission. An unprivileged
          # kill -0 on the root-owned sudo launcher can fail with EPERM,
          # which the old loop read as "compositor died" on the first wait
          # iteration (runs 43707468197, 42016257480), aborting before the
          # socket appeared and leaving cleanup stuck in wait until the
          # inner 1800s timeout.
          launcher_alive() { [ -d "/proc/$compositor" ]; }
          launcher_is_sudo() {
            [ "$(cat "/proc/$compositor/comm" 2>/dev/null)" = sudo ]
          }
          cleanup() {
            # Always try to stop the scope, even if the launcher is already
            # gone (sudo SIGKILL'd; timeout killed; spawned children). While
            # the launcher is alive and stop fails (scope not yet registered),
            # retry for a bounded time; once the launcher is gone, one more
            # stop attempt covers a late-registered scope. Each stop/status
            # is wrapped in timeout; TimeoutStopSec caps systemd's own wait.
            # Bound wall clock so EXIT never blocks near the job timeout.
            local stop_deadline=$((SECONDS + 20))
            local stopped=0
            while [ "$SECONDS" -lt "$stop_deadline" ]; do
              if sudo timeout 15 systemctl stop "$unit.scope" 2>/dev/null; then
                stopped=1
                break
              fi
              if launcher_alive; then
                sleep 0.25
                continue
              fi
              sudo timeout 15 systemctl stop "$unit.scope" 2>/dev/null && stopped=1
              break
            done
            # After a successful stop, give the launcher a short grace to
            # exit before escalating to TERM/KILL.
            if [ "$stopped" -eq 1 ]; then
              local grace_deadline=$((SECONDS + 5))
              while launcher_alive && [ "$SECONDS" -lt "$grace_deadline" ]; do
                sleep 0.25
              done
            fi
            if launcher_alive && launcher_is_sudo; then
              sudo kill -TERM "$compositor" 2>/dev/null || true
              local term_deadline=$((SECONDS + 5))
              while launcher_alive && [ "$SECONDS" -lt "$term_deadline" ]; do
                sleep 0.25
              done
            fi
            if launcher_alive && launcher_is_sudo; then
              sudo kill -KILL "$compositor" 2>/dev/null || true
            fi
            local wait_deadline=$((SECONDS + 5))
            while launcher_alive && [ "$SECONDS" -lt "$wait_deadline" ]; do
              sleep 0.1
            done
            if launcher_alive; then
              echo "cleanup: launcher PID $compositor still alive after ~1 min" >&2
            else
              wait "$compositor" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          socket=
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            socket=$(find "$runtime" -maxdepth 1 -type s \
              -name 'swayward-ipc.*.sock' -print -quit)
            [ -n "$socket" ] && break
            if ! launcher_alive; then
              # One missed check is not death; confirm before giving up.
              sleep 0.25
              launcher_alive || break
            fi
            sleep 0.25
          done
          if [ -z "$socket" ]; then
            echo 'no IPC socket appeared' | tee "$runtime/soak.log"
            echo "--- diagnostics ---" >&2
            ls -la "$runtime" >&2 || true
            echo "--- compositor.log (tail) ---" >&2
            tail -n 50 "$runtime/compositor.log" 2>/dev/null >&2 || true
            echo "--- systemctl status $unit.scope ---" >&2
            sudo timeout 10 systemctl status "$unit.scope" --no-pager >&2 || true
            if launcher_alive; then
              echo "launcher PID $compositor is alive" >&2
            else
              echo "launcher PID $compositor is dead" >&2
            fi
            exit 1
          fi

          set +e
          SWAYSOCK="$socket" contrib/live-ipc-soak \
            --commands 10000 --expected-outputs "${{ matrix.outputs }}" \
            2>&1 | tee "$runtime/soak.log"
          status=${PIPESTATUS[0]}
          set -e

          cleanup
          trap - EXIT
          if grep -E '(^|[^[:alpha:]])ERROR([^[:alpha:]]|$)|panicked at|thread .* panicked' \
              "$runtime/compositor.log"; then
            echo 'compositor log contains an ERROR or panic' >&2
            status=1
          fi
          exit "$status"
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-ipc-soak-${{ matrix.outputs }}-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swayward-runtime-${{ matrix.outputs }}/*.log
          if-no-files-found: warn
